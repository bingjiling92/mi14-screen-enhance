#
# 改完保存，重启生效（framework 只在开机时读一次 displayconfig）。
# 填错会自动回退到 max 档。

# ---------------------------------------------------------------------------
# 亮度上限档位（只影响非 HBM 状态下的「基础亮度天花板」）
#
#   max / high     <transitionPoint> -> 0.952386766   上限 1400 nits   ← 默认
#       实测本机户外阳光模式下已跑到过 1400 nits，属面板已验证范围。
#
#   balanced / safe <transitionPoint> -> 0.808082041  上限 1000 nits
#       1000 nits 是小米自家热控表在高环境光档位允许的上限，更保守。
#
# 原厂是 0.499938，即 500 nits。
# 再往上（>1400 nits）就进入 HDR 峰值区间（表内 1.0 = 2800 nits），
# 全屏持续不可持续，故本模块不提供。
# ---------------------------------------------------------------------------
PROFILE=max

# ---------------------------------------------------------------------------
# 阳光屏（HBM）介入所需环境光，单位 lux。
#   留空 = 保持原厂 5882（推荐）
#   填 2000 之类 = 阳光屏更早介入，户外/阴影下更早变亮，代价是更热更耗电
# 这一项与上面的亮度上限是解耦的，不改就完全没有副作用。
# ---------------------------------------------------------------------------
SUNLIGHT_MIN_LUX=
