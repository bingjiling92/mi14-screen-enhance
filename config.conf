# 小米14 屏幕基础亮度增强 —— 档位选择
# Copyright (c) 2026 bingjiling92 | SPDX-License-Identifier: MIT
#
# balanced : <transitionPoint> -> 0.808082041   基础上限 500 -> 1000 nits  (+100%)
#            只改亮度天花板；minimumLux / sdrHdrRatioMap 全部保持原厂。
#            1000 nits 正是小米自家热控表在高环境光档位允许的上限，稳妥。
#
# max      : <transitionPoint> -> 0.952386766   基础上限 500 -> 1400 nits  (+180%)
#            <minimumLux>      -> 2000（阳光屏更早介入）
#            1400 nits 是实测本机户外阳光模式下已经跑到过的值，属面板已验证范围。
#            代价：更热、更耗电、长时间高亮度对 OLED 寿命不友好。
#
# 改完保存，重启后生效。填错会自动回退 balanced。
PROFILE=balanced
